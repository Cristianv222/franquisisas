worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 5m;          # límite de subida (imágenes)

  # DNS embebido de Docker: re-resuelve las IPs de los servicios (si se
  # reinician, nginx no se queda con una IP vieja en caché).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Conserva el esquema HTTPS original que NPM comunica al gateway.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
  }

  # Upgrade de WebSocket para el servicio de notificaciones.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    location = /api/auth {
      return 308 /api/auth/;
    }

    location = /api/franquicias {
      return 308 /api/franquicias/;
    }

    # ---------------- APIs ----------------
    location /api/auth/ {
      set $up_auth auth:8000;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$up_auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/franquicias/ {
      set $up_franq franquicias:8000;
      rewrite ^/api/franquicias/(.*)$ /$1 break;
      proxy_pass http://$up_franq;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---------------- Imágenes (volumen de medios) ----------------
    location /media/ {
      alias /media/;
      try_files $uri =404;
      expires 7d;
      access_log off;
    }

    # ---------------- WebSockets (tiempo real) ----------------
    location /ws/ {
      set $up_notif notificaciones:8000;
      proxy_pass http://$up_notif;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # ---------------- SPA admin (bajo /admin/) ----------------
    location = /admin {
      return 301 /admin/;
    }

    location /admin/ {
      set $up_admin frontend-admin:80;
      proxy_pass http://$up_admin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # ---------------- SPA franquicia + login (raíz) ----------------
    location / {
      set $up_franq_web frontend-franquicia:80;
      proxy_pass http://$up_franq_web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}
