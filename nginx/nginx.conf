worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 5m;          # límite de subida (imágenes)

  # DNS embebido de Docker: re-resuelve las IPs de los servicios (si se
  # reinician, nginx no se queda con una IP vieja en caché).
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Mapa para el upgrade de WebSocket (tiempo real y HMR de Vite)
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    # ---------------- APIs ----------------
    # /api/auth/login -> auth:/login  (se quita el prefijo /api/auth)
    location /api/auth/ {
      set $up_auth auth:8000;
      rewrite ^/api/auth/(.*)$ /$1 break;
      proxy_pass http://$up_auth;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/franquicias/ {
      set $up_franq franquicias:8000;
      rewrite ^/api/franquicias/(.*)$ /$1 break;
      proxy_pass http://$up_franq;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- Imágenes (volumen de medios) ----------------
    location /media/ {
      alias /media/;
      try_files $uri =404;
      expires 7d;
      access_log off;
    }

    # ---------------- WebSockets (tiempo real) ----------------
    location /ws/ {
      set $up_notif notificaciones:8000;
      proxy_pass http://$up_notif;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------------- SPA admin (bajo /admin/) ----------------
    # La app Vite de admin tiene base: '/admin/'. NO se quita el prefijo
    # para que Vite reciba la ruta /admin/ tal cual y no entre en bucle.
    location /admin/ {
      set $up_admin frontend-admin:5173;
      proxy_pass http://$up_admin;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;          # HMR de Vite
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---------------- SPA franquicia + login (raíz) ----------------
    location / {
      set $up_franq_web frontend-franquicia:5174;
      proxy_pass http://$up_franq_web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;          # HMR de Vite
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
